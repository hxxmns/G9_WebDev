<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Group 9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-shell">

        <section class="auth-panel">
            <div>
                <span class="entry-no">Recovery desk</span>
                <h1 class="wordmark">G9</h1>
                <p class="tagline">We'll help you find your way back in.</p>
            </div>
            <p class="stamp">Group 9 · Registration System</p>
        </section>

        <section class="auth-form-panel">
            <div class="auth-form-wrap">

                <form action="#" method="POST">
                    <h2>Forgot password</h2>
                    <p class="auth-subtext">Enter the email address linked to your account and we'll send you a link to reset your password.</p>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <button type="submit" class="btn-submit">Send reset link</button>

                    <a href="login.html" class="back-link">← Back to sign in</a>
                </form>

            </div>
        </section>

    </main>

    <script>
        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('If an account exists for that email, a reset link has been sent.');
            window.location.href = 'login.html';
        });
    </script>

</body>
</html>
