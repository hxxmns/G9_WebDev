<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Group 9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-shell">

        <section class="auth-panel">
            <div>
                <span class="entry-no">New entry</span>
                <h1 class="wordmark">G9</h1>
                <p class="tagline">Get an entry of your own. Takes less than a minute.</p>
            </div>
            <p class="stamp">Group 9 · Registration System</p>
        </section>

        <section class="auth-form-panel">
            <div class="auth-form-wrap">

                <nav class="auth-tabs">
                    <a href="login.html" class="tab">Sign In</a>
                    <button type="button" class="tab is-active" disabled>Sign Up</button>
                </nav>

                <form action="#" method="POST" id="signupForm">
                    <h2>Create an account</h2>
                    <p class="auth-subtext">Fill in your details to register.</p>

                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="field">
                        <label for="confirm_password">Confirm password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                        <span id="passwordError" class="field-error">Passwords do not match.</span>
                    </div>

                    <div class="check-row">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms and Agreement</a></label>
                    </div>

                    <button type="submit" class="btn-submit">Sign up</button>
                </form>

            </div>
        </section>

    </main>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errorSpan = document.getElementById('passwordError');

            if (password !== confirmPassword) {
                errorSpan.style.display = 'inline';
                return;
            }

            errorSpan.style.display = 'none';
            window.location.href = 'homepage.html';
        });
    </script>

</body>
</html>
